      <div class="relative px-[16px] before:content-[''] before:absolute before:top-0 before:bottom-0 before:w-[16px] before:bg-[radial-gradient(circle,#121214_3px,transparent_3.5px)] before:bg-[length:16px_20px] before:bg-center before:z-[3] before:left-0 after:content-[''] after:absolute after:top-0 after:bottom-0 after:width-[16px] after:bg-[radial-gradient(circle,#121214_3px,transparent_3.5px)] after:bg-[length:16px_20px] after:bg-center after:z-[3] after:right-0 max-[560px]:px-[6px] max-[560px]:before:w-[8px] max-[560px]:before:bg-[length:8px_14px] max-[560px]:after:w-[8px] max-[560px]:after:bg-[length:8px_14px]">

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyACcvo2h4qLgkKdo7-ngWEf_BsDHcu9Uz4",
        authDomain: "multimedia-cog-trece-db.firebaseapp.com",
        projectId: "multimedia-cog-trece-db",
        storageBucket: "multimedia-cog-trece-db.firebasestorage.app",
        messagingSenderId: "590911223632",
        appId: "1:590911223632:web:ca01a50270d9565c6ade55"
    };

    const db = getFirestore(initializeApp(firebaseConfig));

    const dates = ["September 6", "September 13", "September 20", "September 27"];
    const roles = ["LED", "PROMPTER", "PREACHING-SUPPORT"];

    const dateRow = document.getElementById("dateRow");
    const shiftRow = document.getElementById("shiftRow");

    dates.forEach(d => {
        dateRow.innerHTML += `<th colspan="2" class="bg-gold text-[#1a1400] font-mono font-bold tracking-[0.03em] p-[8px] uppercase text-[0.75rem] border border-hairline">${d}</th>`;
        shiftRow.innerHTML += `<th class="bg-panel-raised text-amber font-mono text-[0.65rem] tracking-[0.1em] p-[6px] uppercase border border-hairline">AM</th><th class="bg-panel-raised text-amber font-mono text-[0.65rem] tracking-[0.1em] p-[6px] uppercase border border-hairline">PM</th>`;
    });

    onSnapshot(collection(db, "slots"), (snapshot) => {
        const gridBody = document.getElementById("gridBody");
        gridBody.innerHTML = "";

        roles.forEach(role => {
            let row = `<tr><td class="role-header bg-panel-raised text-paper font-mono font-bold text-[0.68rem] tracking-[0.05em] text-left pl-[12px] uppercase whitespace-nowrap border-l-[3px] border-l-gold border border-hairline">${role}</td>`;
            dates.forEach(date => {
                const amData = snapshot.docs.find(d => d.id === `${date}-AM-${role}`)?.data()?.name;
                const pmData = snapshot.docs.find(d => d.id === `${date}-PM-${role}`)?.data()?.name;
                const amDisplay = amData ? amData : '<span class="inline-block bg-open-bg text-open px-[8px] py-[3px] rounded-[4px] text-[0.62rem] font-bold font-mono tracking-[0.05em] border border-[rgba(74,222,128,0.35)]">OPEN</span>';
                const pmDisplay = pmData ? pmData : '<span class="inline-block bg-open-bg text-open px-[8px] py-[3px] rounded-[4px] text-[0.62rem] font-bold font-mono tracking-[0.05em] border border-[rgba(74,222,128,0.35)]">OPEN</span>';

                row += `<td class="border border-hairline p-[10px_8px] text-center text-[0.8rem] text-[#e4e4e8]">${amDisplay}</td><td class="border border-hairline p-[10px_8px] text-center text-[0.8rem] text-[#e4e4e8]">${pmDisplay}</td>`;
            });
            row += `</tr>`;
            gridBody.innerHTML += row;
        });
    });

    window.toggleMenu = function() {
        document.getElementById('headerButtons').classList.toggle('max-[560px]:flex');
        document.getElementById('headerButtons').classList.toggle('flex');
    }
</script>
<script type="text/javascript" charset="utf-8">

        window.location.href = "september"; // MUST CHANGE EVERY MONTH
