<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Open Graph / Facebook (Social Media) -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://trecemulti.vercel.app/schedule">
    <meta property="og:title" content="Arts Multimedia Ministry - COG Trece | Church of God Trece Martires City">
    <meta property="og:description" content="Arts Multimedia Ministry COG Trece (Church Of God Trece Martires City). Contains about the multimedia ministry, visual live schedules.">
    <meta property="og:image" content="https://trecemulti.vercel.app/thumbnail.png">
    <meta property="og:site_name" content="Arts Multimedia COG Trece">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COG Trece Multimedia | Duty Scheduling</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
</head>

<body class="relative flex min-h-screen items-center justify-center bg-black font-sans text-white antialiased selection:bg-white selection:text-black">

  <!-- Background Video -->
  <video
    src="https://trecemulti.vercel.app/images/bg-home.mp4"
    autoplay
    muted
    loop
    playsinline
    class="fixed inset-0 z-0 h-full w-full object-cover">
  </video>

  <!-- Header matching the image styling -->
  <header class="absolute top-0 z-35 flex w-full items-center justify-between border-b border-t border-white/35 bg-[gray]/10 px-6 sm:px-10 py-5 shadow-2xl backdrop-blur-md">
    <div class="flex items-center gap-3">
      <img src="images/cog.png" alt="COG Logo" class="h-10 w-10 object-contain drop-shadow" />
      <h1 class="text-2xl uppercase text-white tracking-[3px] font-light">ARTS</h1>
    </div>

    <!-- Mobile Menu Toggle -->
    <button type="button" aria-label="Toggle Menu" class="flex md:hidden flex-col justify-center items-center gap-1.5 cursor-pointer p-2.5 rounded-xl border border-white/20 bg-white/5 transition hover:bg-white/10" onclick="toggleMenu()">
      <span class="h-0.5 w-6 bg-white rounded-full"></span>
      <span class="h-0.5 w-6 bg-white rounded-full"></span>
      <span class="h-0.5 w-6 bg-white rounded-full"></span>
    </button>

    <!-- Desktop Navigation Links -->
    <nav class="hidden md:flex items-center gap-8 text-sm uppercase tracking-[3px]">
      <a href="https://trecemulti.vercel.app/" class="rounded-lg px-2.5 py-1 transition duration-300 hover:bg-white/35 hover:text-black">Home</a>
      <a href="about" class="rounded-lg px-2.5 py-1 transition duration-300 hover:bg-white/35 hover:text-black">About</a>
      <a href="duties" class="rounded-lg px-2.5 py-1 transition duration-300 hover:bg-white/35 hover:text-black border-b border-white">Schedule</a>
    </nav>
  </header>

  <!-- Mobile Dropdown Menu -->
  <div id="mobileMenu" class="hidden absolute top-24 right-5 z-40 flex-col gap-2 rounded-2xl border border-white/25 bg-gray-900/95 p-5 shadow-2xl backdrop-blur-2xl md:hidden text-xs uppercase tracking-[3px] w-48">
    <a href="https://trecemulti.vercel.app/" class="rounded-xl px-3 py-2.5 text-center transition hover:bg-white/35 hover:text-black">Home</a>
    <a href="about" class="rounded-xl px-3 py-2.5 text-center transition hover:bg-white/35 hover:text-black">About</a>
    <a href="duties" class="rounded-xl px-3 py-2.5 text-center transition bg-white/25 text-white border-b border-white">Schedule</a>
  </div>

  <!-- Main Content Layout -->
  <main class="z-20 w-[92%] max-w-lg text-white my-32">
    <div class="mb-5 flex items-center justify-between px-2 tracking-[3px]">
      <span class="text-xs uppercase text-white/90 font-medium">COG Trece Multimedia</span>
      <span class="text-xs uppercase text-white/50">Duty Schedules</span>
    </div>

    <!-- Glassmorphism Card with Refined Padding and Spacing -->
    <div class="relative rounded-2xl border border-white/35 bg-white/[0.08] p-6 sm:p-10 shadow-2xl backdrop-blur-xl">

      <div class="mb-8 text-center">
        <h2 class="text-2xl sm:text-3xl font-light tracking-[3px] uppercase">Official Duty Scheduling System</h2>
        <p class="mt-3 text-xs sm:text-sm tracking-widest text-white/80 leading-relaxed">Select an available Sunday to view available slots.</p>
      </div>

      <div class="flex w-full flex-col items-center justify-center tracking-[2px]">
        <!-- Name Input with Clean Focus States -->
        <div class="w-full mb-6 px-2">
          <input
            id="nameInp"
            type="text"
            name="name"
            placeholder="Your Name"
            class="w-full bg-transparent px-2 py-3.5 text-center sm:text-left text-white placeholder-white/50 border-b border-white/50 focus:border-white focus:outline-none tracking-[2px] transition duration-300">
        </div>

        <!-- Selection Status Readouts -->
        <div class="grid w-full grid-cols-1 sm:grid-cols-3 gap-3 mb-8 px-1 text-xs text-white/90 tracking-widest">
          <div class="flex sm:flex-col items-center justify-between sm:justify-center p-3 rounded-xl border border-white/15 bg-white/5 backdrop-blur-sm gap-1">
            <span class="text-white/50 uppercase text-[10px]">Role</span>
            <span id="selectedRole" class="font-medium truncate max-w-[120px] sm:max-w-none">Not selected</span>
          </div>
          <div class="flex sm:flex-col items-center justify-between sm:justify-center p-3 rounded-xl border border-white/15 bg-white/5 backdrop-blur-sm gap-1">
            <span class="text-white/50 uppercase text-[10px]">Date</span>
            <span id="selectedDate" class="font-medium truncate max-w-[120px] sm:max-w-none">Not selected</span>
          </div>
          <div class="flex sm:flex-col items-center justify-between sm:justify-center p-3 rounded-xl border border-white/15 bg-white/5 backdrop-blur-sm gap-1">
            <span class="text-white/50 uppercase text-[10px]">Slot</span>
            <span id="selectedSlot" class="font-medium truncate max-w-[120px] sm:max-w-none">Not selected</span>
          </div>
        </div>

        <!-- Action Buttons -->
        <div class="flex w-full flex-col sm:flex-row justify-center gap-3 mb-6">
          <button
            type="button"
            class="flex-1 rounded-xl border border-white/35 bg-white/10 px-4 py-3.5 [letter-spacing:3px] transition duration-300 hover:bg-white hover:text-black text-xs uppercase font-medium shadow-lg"
            onclick="callOverlayRole(true)">
            Select Role
          </button>

          <button
            type="button"
            class="flex-1 rounded-xl border border-white/35 bg-white/10 px-4 py-3.5 [letter-spacing:3px] transition duration-300 hover:bg-white hover:text-black text-xs uppercase font-medium shadow-lg"
            onclick="callOverlayDate(true)">
            Select Date
          </button>
        </div>

        <!-- Submit Button -->
        <button
          id="submitBtn"
          type="button"
          onclick="submitDutySchedule()"
          class="w-full rounded-xl border border-white/35 bg-white/20 px-6 py-4 font-semibold tracking-[3px] uppercase transition duration-300 hover:bg-white hover:text-black text-xs shadow-xl active:scale-[0.99] disabled:opacity-50">
          Submit Duty Schedule
        </button>

        <p id="statusMessage" class="mt-4 text-center text-xs tracking-wide"></p>
      </div>

      <!-- Date & Slot Overlay Modal -->
      <div
        id="overlayDate"
        class="hidden absolute inset-0 z-30 m-auto h-fit w-[92%] max-w-md rounded-2xl border border-white/35 bg-gray-950/95 p-6 sm:p-8 text-white shadow-2xl backdrop-blur-2xl tracking-[2px]">

        <div class="mb-5 flex items-center justify-between border-b border-white/20 pb-4">
          <h3 class="text-xs sm:text-sm font-semibold uppercase tracking-[3px]">Select Date and Slot</h3>
          <button
            type="button"
            aria-label="Close date selection"
            class="flex h-8 w-8 items-center justify-center rounded-full text-2xl text-white/70 transition hover:bg-white/20"
            onclick="callOverlayDate(false)">
            &times;
          </button>
        </div>

        <div id="dates" class="flex flex-col gap-2.5 text-xs sm:text-sm">
          <button type="button" onclick="setDate('September 6, 2026')" class="w-full rounded-xl border border-white/20 bg-white/10 px-4 py-3.5 text-left transition hover:bg-white hover:text-black shadow-sm">
            September 6, 2026
          </button>
          <button type="button" onclick="setDate('September 13, 2026')" class="w-full rounded-xl border border-white/20 bg-white/10 px-4 py-3.5 text-left transition hover:bg-white hover:text-black shadow-sm">
            September 13, 2026
          </button>
          <button type="button" onclick="setDate('September 20, 2026')" class="w-full rounded-xl border border-white/20 bg-white/10 px-4 py-3.5 text-left transition hover:bg-white hover:text-black shadow-sm">
            September 20, 2026
          </button>
          <button type="button" onclick="setDate('September 27, 2026')" class="w-full rounded-xl border border-white/20 bg-white/10 px-4 py-3.5 text-left transition hover:bg-white hover:text-black shadow-sm">
            September 27, 2026
          </button>
        </div>

        <div class="mt-6 border-t border-white/20 pt-5">
          <h4 class="mb-3 text-xs sm:text-sm font-semibold uppercase tracking-[3px]">Select Slot</h4>

          <div class="flex gap-3 text-xs sm:text-sm">
            <button
              type="button"
              onclick="setSlot('AM Slot')"
              class="w-1/2 rounded-xl border border-white/20 bg-white/10 px-4 py-3.5 transition hover:bg-white hover:text-black shadow-sm text-center font-medium">
              AM Slot
            </button>

            <button
              type="button"
              onclick="setSlot('PM Slot')"
              class="w-1/2 rounded-xl border border-white/20 bg-white/10 px-4 py-3.5 transition hover:bg-white hover:text-black shadow-sm text-center font-medium">
              PM Slot
            </button>
          </div>
        </div>
      </div>

      <!-- Role Overlay Modal -->
      <div
        id="overlayRole"
        class="hidden absolute inset-0 z-30 m-auto h-fit w-[92%] max-w-md rounded-2xl border border-white/35 bg-gray-950/95 p-6 sm:p-8 text-white shadow-2xl backdrop-blur-2xl tracking-[2px]">

        <div class="mb-5 flex items-center justify-between border-b border-white/20 pb-4">
          <h3 class="text-xs sm:text-sm font-semibold uppercase tracking-[3px]">Select Your Role</h3>
          <button
            type="button"
            aria-label="Close role selection"
            class="flex h-8 w-8 items-center justify-center rounded-full text-2xl text-white/70 transition hover:bg-white/20"
            onclick="callOverlayRole(false)">
            &times;
          </button>
        </div>

        <div id="roles" class="flex flex-col gap-2.5 text-xs sm:text-sm">
          <button type="button" onclick="setRole('Prompter')" class="w-full rounded-xl border border-white/20 bg-white/10 px-4 py-3.5 text-left transition hover:bg-white hover:text-black shadow-sm">
            Prompter
          </button>
          <button type="button" onclick="setRole('LED')" class="w-full rounded-xl border border-white/20 bg-white/10 px-4 py-3.5 text-left transition hover:bg-white hover:text-black shadow-sm">
            LED
          </button>
          <button type="button" onclick="setRole('Preaching Support')" class="w-full rounded-xl border border-white/20 bg-white/10 px-4 py-3.5 text-left transition hover:bg-white hover:text-black shadow-sm">
            Preaching Support
          </button>
        </div>
      </div>

    </div>
  </main>

  <!-- Script logic preserved -->
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyACcvo2h4qLgkKdo7-ngWEf_BsDHcu9Uz4",
      authDomain: "multimedia-cog-trece-db.firebaseapp.com",
      projectId: "multimedia-cog-trece-db",
      storageBucket: "multimedia-cog-trece-db.firebasestorage.app",
      messagingSenderId: "590911223632",
      appId: "1:590911223632:web:ca01a50270d9565c6ade55"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const overlayDivDate = document.getElementById("overlayDate");
    const overlayDivRole = document.getElementById("overlayRole");
    const nameInp = document.getElementById("nameInp");
    const selectedRole = document.getElementById("selectedRole");
    const selectedDate = document.getElementById("selectedDate");
    const selectedSlot = document.getElementById("selectedSlot");
    const statusMessage = document.getElementById("statusMessage");
    const submitBtn = document.getElementById("submitBtn");

    let userRole = "";
    let dutyDate = "";
    let dutySlot = "";

    function toggleMenu() {
      const menu = document.getElementById("mobileMenu");
      menu.classList.toggle("hidden");
      menu.classList.toggle("flex");
    }

    function hasName() {
      if (!nameInp.value.trim()) {
        alert("Please enter your name first.");
        nameInp.focus();
        return false;
      }
      return true;
    }

    function callOverlayDate(show) {
      if (show && !hasName()) return;
      overlayDivDate.style.display = show ? "block" : "none";
    }

    function callOverlayRole(show) {
      if (show && !hasName()) return;
      overlayDivRole.style.display = show ? "block" : "none";
    }

    function setRole(role) {
      userRole = role;
      selectedRole.textContent = role;
      callOverlayRole(false);
    }

    function setDate(date) {
      dutyDate = date;
      selectedDate.textContent = date;
    }

    function setSlot(slot) {
      dutySlot = slot;
      selectedSlot.textContent = slot;
      callOverlayDate(false);
    }

    function getSlotDocumentId() {
      const dateWithoutYear = dutyDate.replace(/,\s*\d{4}$/, "");
      const slot = dutySlot.startsWith("AM") ? "AM" : "PM";
      const role = userRole.replace(/\s+/g, "-").toUpperCase();
      return `${dateWithoutYear}-${slot}-${role}`;
    }

    async function submitDutySchedule() {
      if (!nameInp.value.trim() || !userRole || !dutyDate || !dutySlot) {
        statusMessage.textContent = "Please enter your name and select a role, date, and slot.";
        statusMessage.className = "mt-4 text-center text-xs text-yellow-300 tracking-wide";
        return;
      }

      const slotId = getSlotDocumentId();
      const slotRef = db.collection("slots").doc(slotId);

      submitBtn.disabled = true;
      submitBtn.textContent = "Submitting...";

      try {
        await db.runTransaction(async (transaction) => {
          const slotSnapshot = await transaction.get(slotRef);

          if (slotSnapshot.exists && slotSnapshot.data().status === "taken") {
            throw new Error("SLOT_ALREADY_RESERVED");
          }

          transaction.set(slotRef, {
            name: nameInp.value.trim(),
            status: "taken"
          }, { merge: true });
        });

        statusMessage.textContent = `Submitted successfully to slots/${slotId}`;
        statusMessage.className = "mt-4 text-center text-xs text-green-300 tracking-wide";

        nameInp.value = "";
        userRole = "";
        dutyDate = "";
        dutySlot = "";

        selectedRole.textContent = "Not selected";
        selectedDate.textContent = "Not selected";
        selectedSlot.textContent = "Not selected";
      } catch (error) {
        console.error(error);

        if (error.message === "SLOT_ALREADY_RESERVED") {
          statusMessage.textContent = "This slot has already been reserved.";
          statusMessage.className = "mt-4 text-center text-xs text-yellow-300 tracking-wide";
        } else {
          statusMessage.textContent = "Submission failed. Check your Firebase configuration and Firestore rules.";
          statusMessage.className = "mt-4 text-center text-xs text-red-300 tracking-wide";
        }
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Submit Duty Schedule";
      }
    }
  </script>
</body>
</html>
