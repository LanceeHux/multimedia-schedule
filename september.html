<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Open Graph / Facebook (Social Media) -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://trecemulti.vercel.app/schedule">
    <meta property="og:title" content="Arts Multimedia Ministry - COG Trece | Church of God Trece Martires City">
    <meta property="og:description" content="Arts Multimedia Ministry COG Trece (Church Of God Trece Martires City). Contains about the multimedia ministry, visual live schedules.">
    <meta property="og:image" content="https://trecemulti.vercel.app/thumbnail.png">
    <meta property="og:site_name" content="Arts Multimedia COG Trece">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COG Trece Multimedia | Duty Scheduling</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
</head>

<body class="relative flex min-h-screen items-center justify-center bg-gray-950 font-sans text-white antialiased selection:bg-indigo-500 selection:text-white">

  <!-- Background Video with Dark Overlay for Professional Readability -->
  <video
    src="https://trecemulti.vercel.app/images/bg-home.mp4"
    autoplay
    muted
    loop
    playsinline
    class="fixed inset-0 z-0 h-full w-full object-cover">
  </video>
  <div class="fixed inset-0 z-10 bg-gradient-to-br from-gray-950/80 via-gray-900/70 to-indigo-950/80 backdrop-blur-[2px]"></div>

  <!-- Professional Header -->
  <header class="absolute top-0 z-30 flex w-full items-center justify-between border-b border-white/10 bg-gray-900/40 px-8 py-5 shadow-2xl backdrop-blur-md">
    <div class="flex items-center gap-3">
      <div class="flex h-9 w-9 items-center justify-center rounded-xl bg-indigo-600/30 border border-indigo-500/30 text-indigo-300 font-bold tracking-widest text-sm">AM</div>
      <h1 class="font-semibold tracking-[4px] text-lg text-white/90">ARTS</h1>
    </div>

    <button type="button" aria-label="Theme" class="rounded-xl border border-white/10 bg-white/5 p-2.5 text-white/70 transition hover:bg-white/10 hover:text-white">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16">
        <path d="M8 5a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3m4 3a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3M5.5 7a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0m.5 6a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3"/>
        <path d="M16 8c0 3.15-1.866 2.585-3.567 2.07C11.42 9.763 10.465 9.473 10 10c-.603.683-.475 1.819-.351 2.92C9.826 14.495 9.996 16 8 16a8 8 0 1 1 8-8m-8 7c.611 0 .654-.171.655-.176.078-.146.124-.464.07-1.119-.014-.168-.037-.37-.061-.591-.052-.464-.112-1.005-.118-1.462-.01-.707.083-1.61.704-2.314.369-.417.845-.578 1.272-.618.404-.038.812.026 1.16.104.343.077.702.186 1.025.284l.028.008c.346.105.658.199.953.266.653.148.904.083.991.024C14.717 9.38 15 9.161 15 8a7 7 0 1 0-7 7"/>
      </svg>
    </button>
  </header>

  <!-- Main Content Layout -->
  <main class="z-20 w-[90%] max-w-xl text-white my-28">
    <div class="mb-4 flex items-center justify-between px-1">
      <span class="text-xs uppercase tracking-widest text-indigo-300 font-medium">COG Trece Multimedia</span>
      <span class="text-xs uppercase tracking-widest text-white/50 font-medium">Duty Schedules</span>
    </div>

    <!-- Glassmorphism Card -->
    <div class="relative rounded-2xl border border-white/10 bg-gray-900/60 p-8 shadow-2xl backdrop-blur-xl">

      <div class="mb-6 text-center">
        <h2 class="text-2xl font-bold tracking-tight text-white sm:text-3xl">Official Duty Scheduling</h2>
        <p class="mt-2 text-sm text-white/60">Enter your name, choose your preferred role, date, and slot to secure your assignment.</p>
      </div>

      <div class="flex w-full flex-col items-center justify-center">
        <!-- Name Input -->
        <div class="relative w-full mb-6">
          <input
            id="nameInp"
            type="text"
            name="name"
            placeholder="Enter your full name"
            class="w-full rounded-xl border border-white/10 bg-white/5 px-4 py-3.5 text-white placeholder-white/40 transition focus:border-indigo-500 focus:bg-white/10 focus:outline-none focus:ring-2 focus:ring-indigo-500/20">
        </div>

        <!-- Selection Status Badges -->
        <div class="grid w-full grid-cols-1 gap-2 mb-6 sm:grid-cols-3">
          <div class="flex items-center justify-between rounded-lg border border-white/5 bg-white/5 px-3 py-2 text-xs text-white/80">
            <span class="text-white/40">Role:</span>
            <span id="selectedRole" class="font-medium text-indigo-300">Not selected</span>
          </div>
          <div class="flex items-center justify-between rounded-lg border border-white/5 bg-white/5 px-3 py-2 text-xs text-white/80">
            <span class="text-white/40">Date:</span>
            <span id="selectedDate" class="font-medium text-indigo-300">Not selected</span>
          </div>
          <div class="flex items-center justify-between rounded-lg border border-white/5 bg-white/5 px-3 py-2 text-xs text-white/80">
            <span class="text-white/40">Slot:</span>
            <span id="selectedSlot" class="font-medium text-indigo-300">Not selected</span>
          </div>
        </div>

        <!-- Action Triggers -->
        <div class="flex w-full flex-wrap justify-center gap-3 mb-6">
          <button
            type="button"
            class="flex-1 min-w-[130px] rounded-xl border border-white/10 bg-white/5 px-4 py-3 text-sm font-medium tracking-wide transition hover:bg-white/10 hover:border-indigo-500/50 hover:text-indigo-200"
            onclick="callOverlayRole(true)">
            Select Role
          </button>

          <button
            type="button"
            class="flex-1 min-w-[130px] rounded-xl border border-white/10 bg-white/5 px-4 py-3 text-sm font-medium tracking-wide transition hover:bg-white/10 hover:border-indigo-500/50 hover:text-indigo-200"
            onclick="callOverlayDate(true)">
            Select Date & Slot
          </button>
        </div>

        <!-- Submit Button -->
        <button
          id="submitBtn"
          type="button"
          onclick="submitDutySchedule()"
          class="w-full rounded-xl bg-indigo-600 px-6 py-3.5 font-medium tracking-wide text-white shadow-lg shadow-indigo-600/30 transition hover:bg-indigo-500 active:scale-[0.99] disabled:opacity-50">
          Submit Duty Schedule
        </button>

        <p id="statusMessage" class="mt-4 text-center text-xs font-medium"></p>
      </div>

      <!-- Date & Slot Overlay Modal -->
      <div
        id="overlayDate"
        class="hidden absolute inset-0 z-30 m-auto h-fit w-[92%] max-w-md -translate-y-2 rounded-2xl border border-white/15 bg-gray-900/95 p-6 text-white shadow-2xl backdrop-blur-2xl">

        <div class="mb-5 flex items-center justify-between border-b border-white/10 pb-4">
          <h3 class="text-xs font-semibold uppercase tracking-[3px] text-white/70">Select Date & Slot</h3>
          <button
            type="button"
            aria-label="Close date selection"
            class="flex h-8 w-8 items-center justify-center rounded-full text-xl text-white/60 transition hover:bg-white/10 hover:text-white"
            onclick="callOverlayDate(false)">
            &times;
          </button>
        </div>

        <div id="dates" class="flex flex-col gap-2">
          <button type="button" onclick="setDate('September 6, 2026')" class="w-full rounded-xl border border-white/10 bg-white/5 px-4 py-3 text-left text-sm transition hover:bg-indigo-600/20 hover:border-indigo-500/40 hover:text-white">
            September 6, 2026
          </button>
          <button type="button" onclick="setDate('September 13, 2026')" class="w-full rounded-xl border border-white/10 bg-white/5 px-4 py-3 text-left text-sm transition hover:bg-indigo-600/20 hover:border-indigo-500/40 hover:text-white">
            September 13, 2026
          </button>
          <button type="button" onclick="setDate('September 20, 2026')" class="w-full rounded-xl border border-white/10 bg-white/5 px-4 py-3 text-left text-sm transition hover:bg-indigo-600/20 hover:border-indigo-500/40 hover:text-white">
            September 20, 2026
          </button>
          <button type="button" onclick="setDate('September 27, 2026')" class="w-full rounded-xl border border-white/10 bg-white/5 px-4 py-3 text-left text-sm transition hover:bg-indigo-600/20 hover:border-indigo-500/40 hover:text-white">
            September 27, 2026
          </button>
        </div>

        <div class="mt-6 border-t border-white/10 pt-5">
          <h4 class="mb-3 text-xs font-semibold uppercase tracking-[3px] text-white/70">Select Slot</h4>

          <div class="flex gap-3">
            <button
              type="button"
              onclick="setSlot('AM Slot')"
              class="w-1/2 rounded-xl border border-white/10 bg-white/5 px-4 py-3 text-sm transition hover:bg-indigo-600/20 hover:border-indigo-500/40 hover:text-white">
              AM Slot
            </button>

            <button
              type="button"
              onclick="setSlot('PM Slot')"
              class="w-1/2 rounded-xl border border-white/10 bg-white/5 px-4 py-3 text-sm transition hover:bg-indigo-600/20 hover:border-indigo-500/40 hover:text-white">
              PM Slot
            </button>
          </div>
        </div>
      </div>

      <!-- Role Overlay Modal -->
      <div
        id="overlayRole"
        class="hidden absolute inset-0 z-30 m-auto h-fit w-[92%] max-w-md -translate-y-2 rounded-2xl border border-white/15 bg-gray-900/95 p-6 text-white shadow-2xl backdrop-blur-2xl">

        <div class="mb-5 flex items-center justify-between border-b border-white/10 pb-4">
          <h3 class="text-xs font-semibold uppercase tracking-[3px] text-white/70">Select Your Role</h3>
          <button
            type="button"
            aria-label="Close role selection"
            class="flex h-8 w-8 items-center justify-center rounded-full text-xl text-white/60 transition hover:bg-white/10 hover:text-white"
            onclick="callOverlayRole(false)">
            &times;
          </button>
        </div>

        <div id="roles" class="flex flex-col gap-2">
          <button type="button" onclick="setRole('Prompter')" class="w-full rounded-xl border border-white/10 bg-white/5 px-4 py-3 text-left text-sm transition hover:bg-indigo-600/20 hover:border-indigo-500/40 hover:text-white">
            Prompter
          </button>
          <button type="button" onclick="setRole('LED')" class="w-full rounded-xl border border-white/10 bg-white/5 px-4 py-3 text-left text-sm transition hover:bg-indigo-600/20 hover:border-indigo-500/40 hover:text-white">
            LED
          </button>
          <button type="button" onclick="setRole('Preaching Support')" class="w-full rounded-xl border border-white/10 bg-white/5 px-4 py-3 text-left text-sm transition hover:bg-indigo-600/20 hover:border-indigo-500/40 hover:text-white">
            Preaching Support
          </button>
        </div>
      </div>

    </div>
  </main>

  <!-- Script logic untouched -->
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyACcvo2h4qLgkKdo7-ngWEf_BsDHcu9Uz4",
      authDomain: "multimedia-cog-trece-db.firebaseapp.com",
      projectId: "multimedia-cog-trece-db",
      storageBucket: "multimedia-cog-trece-db.firebasestorage.app",
      messagingSenderId: "590911223632",
      appId: "1:590911223632:web:ca01a50270d9565c6ade55"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const overlayDivDate = document.getElementById("overlayDate");
    const overlayDivRole = document.getElementById("overlayRole");
    const nameInp = document.getElementById("nameInp");
    const selectedRole = document.getElementById("selectedRole");
    const selectedDate = document.getElementById("selectedDate");
    const selectedSlot = document.getElementById("selectedSlot");
    const statusMessage = document.getElementById("statusMessage");
    const submitBtn = document.getElementById("submitBtn");

    let userRole = "";
    let dutyDate = "";
    let dutySlot = "";

    function hasName() {
      if (!nameInp.value.trim()) {
        alert("Please enter your name first.");
        nameInp.focus();
        return false;
      }
      return true;
    }

    function callOverlayDate(show) {
      if (show && !hasName()) return;
      overlayDivDate.style.display = show ? "block" : "none";
    }

    function callOverlayRole(show) {
      if (show && !hasName()) return;
      overlayDivRole.style.display = show ? "block" : "none";
    }

    function setRole(role) {
      userRole = role;
      selectedRole.textContent = role;
      callOverlayRole(false);
    }

    function setDate(date) {
      dutyDate = date;
      selectedDate.textContent = date;
    }

    function setSlot(slot) {
      dutySlot = slot;
      selectedSlot.textContent = slot;
      callOverlayDate(false);
    }

    function getSlotDocumentId() {
      const dateWithoutYear = dutyDate.replace(/,\s*\d{4}$/, "");
      const slot = dutySlot.startsWith("AM") ? "AM" : "PM";
      const role = userRole.replace(/\s+/g, "-").toUpperCase();
      return `${dateWithoutYear}-${slot}-${role}`;
    }

    async function submitDutySchedule() {
      if (!nameInp.value.trim() || !userRole || !dutyDate || !dutySlot) {
        statusMessage.textContent = "Please enter your name and select a role, date, and slot.";
        statusMessage.className = "mt-4 text-center text-xs font-medium text-amber-300";
        return;
      }

      const slotId = getSlotDocumentId();
      const slotRef = db.collection("slots").doc(slotId);

      submitBtn.disabled = true;
      submitBtn.textContent = "Submitting...";

      try {
        await db.runTransaction(async (transaction) => {
          const slotSnapshot = await transaction.get(slotRef);

          if (slotSnapshot.exists && slotSnapshot.data().status === "taken") {
            throw new Error("SLOT_ALREADY_RESERVED");
          }

          transaction.set(slotRef, {
            name: nameInp.value.trim(),
            status: "taken"
          }, { merge: true });
        });

        statusMessage.textContent = `Submitted successfully!`;
        statusMessage.className = "mt-4 text-center text-xs font-medium text-emerald-400";

        nameInp.value = "";
        userRole = "";
        dutyDate = "";
        dutySlot = "";

        selectedRole.textContent = "Not selected";
        selectedDate.textContent = "Not selected";
        selectedSlot.textContent = "Not selected";
      } catch (error) {
        console.error(error);

        if (error.message === "SLOT_ALREADY_RESERVED") {
          statusMessage.textContent = "This slot has already been reserved.";
          statusMessage.className = "mt-4 text-center text-xs font-medium text-amber-300";
        } else {
          statusMessage.textContent = "Submission failed. Check your configuration.";
          statusMessage.className = "mt-4 text-center text-xs font-medium text-rose-400";
        }
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Submit Duty Schedule";
      }
    }
  </script>
</body>
</html>
